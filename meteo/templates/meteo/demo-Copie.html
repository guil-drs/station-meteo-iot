{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Météo</title>

    <link rel="stylesheet" type="text/css" href="{% static 'meteo/styles.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <h1>Station Météo - Dashboard</h1>

    <!-- Résumé des dernières valeurs -->
    <div class="kpi-row">
        <div class="kpi-card kpi-temp">
            <div class="label">Température</div>
            <div class="value" id="kpi-temp">—</div>
            <div class="minmax" id="kpi-temp-mm"></div>
        </div>
        <div class="kpi-card kpi-pression">
            <div class="label">Pression</div>
            <div class="value" id="kpi-pression">—</div>
            <div class="minmax" id="kpi-pression-mm"></div>
        </div>
        <div class="kpi-card kpi-altitude">
            <div class="label">Altitude</div>
            <div class="value" id="kpi-altitude">—</div>
            <div class="minmax" id="kpi-altitude-mm"></div>
        </div>
    </div>

    <!-- Graphiques -->
    <div class="graphiques-row">
        <div class="Graphiques">
            <canvas id="GraphiqueTempérature"></canvas>
        </div>
        <div class="Graphiques">
            <canvas id="GraphiquePression"></canvas>
        </div>
        <div class="Graphiques">
            <canvas id="GraphiqueAltitude"></canvas>
        </div>
    </div>

    <script>
        const mesures = JSON.parse('{{ mesures_json|safe }}');

        // DONNÉES
        const labels = mesures.map(m => m.timestamp);
        const tempData = mesures.map(m => m.temperature);
        const pressionData = mesures.map(m => m.pression);
        const altitudeData = mesures.map(m => m.altitude);

        // KPI — dernière valeur + min/max
        function fillKPI(valueId, mmId, data, unit, decimals = 1) {
            if (!data.length) return;
            const last = data[data.length - 1];
            const min  = Math.min(...data).toFixed(decimals);
            const max  = Math.max(...data).toFixed(decimals);
            document.getElementById(valueId).textContent = last.toFixed(decimals) + ' ' + unit;
            document.getElementById(mmId).textContent    = `↓ ${min}  ↑ ${max}`;
        }

        fillKPI('kpi-temp',     'kpi-temp-mm',     tempData,     '°C');
        fillKPI('kpi-pression', 'kpi-pression-mm', pressionData, 'hPa');
        fillKPI('kpi-altitude', 'kpi-altitude-mm', altitudeData, 'm', 0);

        // FONCTION ÉCHELLE DYNAMIQUE
        function getScale(data) {
            const min = Math.min(...data);
            const max = Math.max(...data);
            const range = max - min;
            if (range === 0) return { min: min - 1, max: max + 1 };
            const padding = range * 0.1;
            return { min: min - padding, max: max + padding };
        }

        // TEMPÉRATURE
        new Chart(document.getElementById('GraphiqueTempérature'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Température (°C)',
                    data: tempData,
                    borderColor: 'red',
                    backgroundColor: 'rgba(255,0,0,0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                scales: { y: getScale(tempData) }
            }
        });

        // PRESSION
        new Chart(document.getElementById('GraphiquePression'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Pression (hPa)',
                    data: pressionData,
                    borderColor: 'blue',
                    backgroundColor: 'rgba(0,0,255,0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                scales: { y: getScale(pressionData) }
            }
        });

        // ALTITUDE
        new Chart(document.getElementById('GraphiqueAltitude'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Altitude (m)',
                    data: altitudeData,
                    borderColor: 'green',
                    backgroundColor: 'rgba(0,255,0,0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                scales: { y: getScale(altitudeData) }
            }
        });
    </script>
</body>
</html>
